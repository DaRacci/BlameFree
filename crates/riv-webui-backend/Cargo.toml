[package]
name = "riv-webui-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "riv-webui-backend"
path = "src/main.rs"

[features]
default = [
  "backend",
  "oauth2",
  "exp16_adaptive_agents",
  "exp14_template_vars",
]
backend = ["riv-shared/backend"]
oauth2 = ["dep:oauth2", "dep:reqwest"]
exp14_template_vars = ["riv-harness/exp14_template_vars"]
exp16_adaptive_agents = ["riv-harness/exp16_adaptive_agents"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
riv-agents = { path = "../riv-agents" }
riv-benchmark = { path = "../riv-benchmark" }
riv-types = { path = "../riv-types" }
riv-harness = { path = "../riv-harness" }
riv-reporting = { path = "../riv-reporting" }
riv-shared = { path = "../riv-shared" }
riv-webui-shared = { path = "../riv-webui-shared" }
riv-stor = { path = "../riv-stor" }
oauth2 = { workspace = true, optional = true }
octocrab = { workspace = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
tokio-stream = { workspace = true, features = ["sync"] }
toml = { workspace = true }
tower-http = { workspace = true, features = ["cors", "fs", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
mti = { workspace = true }
rig-core = { workspace = true }
leptos = { workspace = true, features = ["ssr"] }
leptos_axum = { workspace = true }
riv-webui-app = { path = "../riv-webui-app", features = ["ssr"] }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
